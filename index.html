<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>涨停板分析</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        #logs { height: 300px; overflow-y: scroll; border: 1px solid #ccc; padding: 10px; }
    </style>
</head>
<body>
    <h1>涨停板分析</h1>
    <form id="analysisForm">
        <label for="date">选择日期:</label>
        <input type="date" id="date" name="date" required value="{{ default_date }}">
        <button type="submit">分析</button>
    </form>
    <div id="result"></div>
    <h2>日志</h2>
    <div id="logs"></div>

    <script>
        document.getElementById('analysisForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const date = document.getElementById('date').value;
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '分析中...';

            fetch('/analyze', {
                method: 'POST',
                body: new FormData(document.getElementById('analysisForm'))
            })
            .then(response => {
                if (response.ok && response.headers.get('content-type').includes('image/png')) {
                    return response.blob().then(blob => {
                        const url = URL.createObjectURL(blob);
                        resultDiv.innerHTML = `<a href="${url}" download="stock_analysis_${date}.png">下载分析图片</a>`;
                    });
                } else {
                    return response.json().then(data => {
                        resultDiv.innerHTML = `错误: ${data.error}`;
                    });
                }
            })
            .catch(error => {
                resultDiv.innerHTML = `请求失败: ${error}`;
            });
        });

        function fetchLogs() {
            fetch('/logs')
                .then(response => response.json())
                .then(data => {
                    const logsDiv = document.getElementById('logs');
                    logsDiv.innerHTML = data.logs.join('<br>');
                    logsDiv.scrollTop = logsDiv.scrollHeight;
                });
        }

        setInterval(fetchLogs, 2000);
        fetchLogs();
    </script>
</body>
</html>
